[project]
name = "basira-backend"
version = "0.1.0"
description = "Basira - AI code reviewer (backend)"
requires-python = ">=3.13"
dependencies = [
    # fastapi <=0.115 pins starlette <0.47 (CVE-2025-54121, CVE-2025-62727).
    # 0.136 + starlette 0.49.1 clears both.
    "fastapi==0.136.1",
    "starlette==1.0.0",
    "uvicorn[standard]==0.47.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "redis==7.4.0",
    "arq==0.28.0",
    "httpx==0.28.1",
    "anthropic==0.103.1",
    "bcrypt==5.0.0",
    # cryptography 44.0.0 had CVE-2024-12797, CVE-2026-26007, CVE-2026-34073;
    # 46.0.7 fixes CVE-2026-39892
    "cryptography==48.0.0",
    # pyjwt 2.10.1 had CVE-2026-32597 (signature confusion). 2.12.0 had
    # PYSEC-2025-183. 2.12.1 is the current clean release.
    "pyjwt==2.12.1",
    "slowapi==0.1.9",
    # python-multipart 0.0.20 had 3 CVEs (DoS via crafted multipart)
    "python-multipart==0.0.29",
    "structlog==25.5.0",
    "tenacity==9.1.4",
    "PyGithub==2.9.1",
]

[project.optional-dependencies]
dev = [
    # dev-only tools; CVE fixes are not load-bearing but pinning current
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.15.14",
    "black==26.5.1",
    "mypy==2.1.0",
    "asgi-lifespan==2.1.0",
    "bandit==1.9.4",
    "pip-audit==2.10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "S", "C4", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"tests/conftest.py" = ["S105", "S106", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "alembic/*",
  "app/workers/main.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
show_missing = true

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
