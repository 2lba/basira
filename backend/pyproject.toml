[project]
name = "reviewly-backend"
version = "0.1.0"
description = "Reviewly - AI code reviewer (backend)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "arq==0.26.3",
    "httpx==0.28.1",
    "anthropic==0.42.0",
    "bcrypt==4.2.1",
    "cryptography==44.0.0",
    "pyjwt==2.10.1",
    "slowapi==0.1.9",
    "python-multipart==0.0.20",
    "structlog==25.1.0",
    "tenacity==9.0.0",
    "PyGithub==2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "black==24.10.0",
    "mypy==1.14.0",
    "asgi-lifespan==2.1.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "S", "C4", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "alembic/*",
  "app/workers/main.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
show_missing = true

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
