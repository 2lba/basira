name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: basira
          POSTGRES_USER: basira
          POSTGRES_PASSWORD: basira_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basira -d basira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      # conftest.py rewrites this to .../basira_test so the autouse
      # _clean_state fixture can TRUNCATE freely without touching the
      # dev/prod database. We pre-create basira_test below.
      DATABASE_URL: postgresql+asyncpg://basira:basira_dev_password@localhost:5432/basira
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret
      TOKEN_ENCRYPTION_KEY: dVBTW1fvoM_FcogEF4ThvfRKNU6QlWqQ-Gtykc8Qrok=
      GITHUB_APP_WEBHOOK_SECRET: test_webhook_secret

    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}

      - name: install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        working-directory: backend
        run: ruff check app tests

      - name: black
        working-directory: backend
        run: black --check app tests

      - name: bandit
        working-directory: backend
        continue-on-error: true  # surface but don't block
        run: bandit -r app -ll

      - name: create test db
        env:
          PGPASSWORD: basira_dev_password
        run: |
          psql -h localhost -U basira -d postgres \
            -c "CREATE DATABASE basira_test OWNER basira;" || true

      - name: migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://basira:basira_dev_password@localhost:5432/basira
        run: alembic upgrade head

      - name: migrate test db
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://basira:basira_dev_password@localhost:5432/basira_test
        run: alembic upgrade head

      - name: tests
        working-directory: backend
        run: pytest --cov --cov-report=xml -q

      - name: pip-audit
        working-directory: backend
        # --strict treats the local editable package as a hard fail; we
        # only care about pinned third-party CVEs.
        run: pip-audit --skip-editable

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package.json') }}

      - name: install
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: build
        working-directory: frontend
        run: npm run build

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
