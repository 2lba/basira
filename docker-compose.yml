services:
  postgres:
    image: postgres:16-alpine
    container_name: basira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basira}
      POSTGRES_USER: ${POSTGRES_USER:-basira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basira_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basira} -d ${POSTGRES_DB:-basira}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: basira-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: basira-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-basira}:${POSTGRES_PASSWORD:-basira_dev_password}@postgres:5432/${POSTGRES_DB:-basira}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
      - ./secrets:/run/secrets:ro
    command: ["bash", "/app/entrypoint.sh", "api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: basira-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-basira}:${POSTGRES_PASSWORD:-basira_dev_password}@postgres:5432/${POSTGRES_DB:-basira}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./secrets:/run/secrets:ro
    command: ["bash", "/app/entrypoint.sh", "worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: basira-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
      VITE_BACKEND_INTERNAL_URL: ${VITE_BACKEND_INTERNAL_URL:-http://backend:8000}
      VITE_PUBLIC_HMR_HOST: ${VITE_PUBLIC_HMR_HOST-}
      VITE_PUBLIC_HMR_PORT: ${VITE_PUBLIC_HMR_PORT-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
  redis_data:
